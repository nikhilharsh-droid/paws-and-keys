<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paws &amp; Keys</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one full-screen toy box. Chunky outlined "sticker" cards on a sky ground, top bar + one screen at a time. */
:root{
  --sky:#CFEAFF; --sky2:#EAF7FF; --ink:#22305A; --ink2:#4A5888; --paper:#FFFFFF; --paper2:#F4F8FF;
  --sun:#FFC83D; --sun-d:#E0A100; --grass:#3FBF73; --grass-d:#2A9A57; --berry:#FF5D8F; --berry-d:#D93C6E;
  --wave:#3E8BFF; --wave-d:#2465D6; --grape:#8C6BF2; --line:#22305A; --shadow:rgba(34,48,90,.22);
  --f-pinky:#B07CFF; --f-ring:#4DA3FF; --f-middle:#2FC27A; --f-index:#FFA62B; --f-thumb:#B8C4DE;
  --display:"Baloo 2","Lexend",system-ui,sans-serif; --body:"Lexend",system-ui,sans-serif; --kid:"Andika","Lexend",system-ui,sans-serif;
  --r:22px; color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(circle at 12% 18%,rgba(255,255,255,.7) 0 38px,transparent 39px),
  radial-gradient(circle at 16% 15%,rgba(255,255,255,.7) 0 30px,transparent 31px),
  radial-gradient(circle at 84% 12%,rgba(255,255,255,.6) 0 34px,transparent 35px),
  radial-gradient(circle at 88% 15%,rgba(255,255,255,.6) 0 26px,transparent 27px),
  linear-gradient(var(--sky2),var(--sky) 60%);z-index:0}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--wave);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main{flex:1;min-height:0;overflow:auto;padding-block:12px 16px}
.main.fit{overflow:auto;display:flex;flex-direction:column}

/* chunky buttons */
.btn{border:3px solid var(--line);background:var(--paper);border-radius:18px;padding:10px 18px;font-family:var(--display);font-weight:700;font-size:20px;box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:52px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.sun{background:var(--sun)} .btn.grass{background:var(--grass);color:#fff} .btn.berry{background:var(--berry);color:#fff} .btn.wave{background:var(--wave);color:#fff} .btn.grape{background:var(--grape);color:#fff}
.btn.big{font-size:26px;padding:14px 26px;min-height:64px;border-radius:22px}
.btn.small{font-size:16px;padding:6px 12px;min-height:40px;border-radius:14px;box-shadow:0 4px 0 var(--line)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.icon-btn{width:52px;height:52px;padding:0;border-radius:16px}
.card{background:var(--paper);border:3px solid var(--line);border-radius:var(--r);box-shadow:0 6px 0 var(--shadow)}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;padding-block:10px 4px;flex-wrap:wrap}
.topbar .who{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:3px 14px 3px 3px;font-family:var(--display);font-weight:700;font-size:20px;min-height:46px}
.topbar .who .face{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--sky2);border:2px solid var(--line)}
.topbar .who .face svg{width:100%;height:100%;display:block}
.swb{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);padding:0;box-shadow:0 3px 0 var(--line)}
.swb.on{outline:4px solid var(--grass);outline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:4px 14px 4px 8px;font-family:var(--display);font-weight:800;font-size:22px;min-height:46px;font-variant-numeric:tabular-nums}
.chip svg{width:28px;height:28px}
.spacer{flex:1}
.coin-pop{animation:coinpop .5s}
@keyframes coinpop{40%{transform:scale(1.25)}}

/* profiles */
.title-logo{display:flex;align-items:center;gap:14px;justify-content:center;padding-top:18px}
.title-logo h1{font-size:clamp(44px,7vw,76px);font-weight:800;color:var(--ink);letter-spacing:.5px;text-shadow:0 4px 0 #fff}
.title-logo h1 span{color:var(--berry)}
.sub{text-align:center;font-size:20px;color:var(--ink2);margin:4px 0 18px}
.players{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.pcard{width:190px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform .12s}
.pcard:hover{transform:translateY(-4px) rotate(-1deg)}
.pcard .pic{width:150px;height:150px;border-radius:18px;border:3px solid var(--line);overflow:hidden;position:relative}
.pcard .pic .av{position:absolute;left:8px;bottom:-8px;width:110px}
.pcard .pic .pt{position:absolute;right:-4px;bottom:0;width:66px}
.pcard .nm{font-family:var(--display);font-weight:800;font-size:26px}
.pcard.add{justify-content:center;border-style:dashed;background:var(--paper2);min-height:226px}
.pcard.add .plus{width:84px;height:84px;border-radius:50%;background:var(--grass);border:3px solid var(--line);display:grid;place-items:center;color:#fff;font-size:60px;font-family:var(--display);font-weight:800;line-height:1}
.footlinks{display:flex;justify-content:center;gap:12px;margin-top:22px}

/* home */
.home{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:18px;height:100%;min-height:0}
.lcol{display:flex;flex-direction:column;gap:14px;min-height:0}
.lcol .stage-card{flex:1}
.lcol .goal{grid-column:auto}
.stage-card{position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.stage{flex:1;min-height:200px;position:relative;border-bottom:3px solid var(--line);overflow:hidden}
.stage .av{position:absolute;left:6%;bottom:-6%;width:62%;max-width:220px}
.stage .pt{position:absolute;right:4%;bottom:4%;width:36%;max-width:130px;cursor:pointer}
.stage-card .row{display:flex;gap:10px;padding:12px;flex-wrap:wrap}
.stage-card .row .btn{flex:1}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-content:start;min-height:0}
.tile{border:3px solid var(--line);border-radius:var(--r);box-shadow:0 6px 0 var(--line);padding:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;min-height:118px;position:relative;overflow:hidden;transition:transform .1s}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.tile h3{font-size:28px;font-weight:800}
.tile p{margin:0;font-size:15px;font-weight:500;max-width:calc(100% - 64px);position:relative;z-index:1}
.tile h3{position:relative;z-index:1}
.tile .art{position:absolute;right:-6px;bottom:-8px;width:96px;height:96px;opacity:.95}
.tile.lessons{grid-column:span 2;background:var(--sun)}
.tile.bubble{background:#9ED8FF} .tile.dash{background:#B9F0C9} .tile.dig{background:#FFD9A8} .tile.stickers{background:#FFC6DA} .tile.badges{background:#DCCFFF}
.goal{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:12px 16px}
.goal .bar{flex:1;height:22px;border:3px solid var(--line);border-radius:999px;background:var(--paper2);overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--grass);transition:width .5s}
.goal b{font-family:var(--display);font-size:20px}

/* lesson map */
.map{display:flex;flex-direction:column;gap:12px}
.island{padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.island h2{font-size:24px;min-width:150px}
.island .nodes{display:flex;gap:12px;flex-wrap:wrap;flex:1}
.node{width:96px;min-height:96px;border-radius:24px;border:3px solid var(--line);background:var(--paper);box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px}
.node .k{font-family:var(--kid);font-weight:700;font-size:28px;line-height:1}
.node .t{font-size:12px;font-weight:600;line-height:1.1;text-align:center}
.node .st{display:flex;gap:1px}
.node .st svg{width:18px;height:18px}
.node.locked{background:#E3E9F5;color:#8C98B8;box-shadow:0 5px 0 #8C98B8;border-color:#8C98B8;cursor:not-allowed}
.node.next{background:var(--sun);animation:wiggle 1.6s infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-4deg)}20%{transform:rotate(4deg)}30%{transform:rotate(0)}}

/* typing */
.typing{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.prompt-wrap{flex:1;min-height:140px;display:flex;gap:14px;align-items:stretch}
.prompt{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px 18px;position:relative;min-width:0}
.prompt .lbl{font-size:16px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.line{font-family:var(--kid);font-size:clamp(34px,5.2vw,60px);font-weight:700;letter-spacing:2px;white-space:pre-wrap;text-align:center;word-break:break-word;line-height:1.25}
.line .c{display:inline-block;padding:0 1px;border-radius:8px;color:#9AA6C6;transition:color .1s}
.line .c.done{color:var(--grass-d)}
.line .c.err{color:var(--berry)}
.line .c.cur{color:var(--ink);background:var(--sun);box-shadow:0 4px 0 var(--sun-d);animation:bob .9s infinite}
.line .c.sp{min-width:.5em}
.line .c.sp.cur::after{content:"␣";font-size:.6em;color:var(--ink)}
@keyframes bob{50%{transform:translateY(-4px)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.dots{display:flex;gap:8px;margin-top:10px}
.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);background:var(--paper)}
.dots i.on{background:var(--grass)}
.buddy{width:170px;flex:none;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px;overflow:hidden}
.buddy .av{width:120px} .buddy .pt{width:84px;margin-top:-40px;margin-left:80px}
.bubble-talk{position:absolute;top:8px;left:8px;right:8px;background:var(--paper2);border:3px solid var(--line);border-radius:16px;padding:6px 8px;font-family:var(--display);font-weight:700;font-size:17px;text-align:center;min-height:34px}
.finger-hint{display:flex;align-items:center;gap:10px;justify-content:center;font-family:var(--display);font-weight:700;font-size:22px;min-height:30px}
.finger-hint .sw{width:22px;height:22px;border-radius:50%;border:3px solid var(--line)}

/* keyboard + hands */
.kb-area{display:flex;flex-direction:column;align-items:center;gap:6px}
.kb{display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--ink);border-radius:20px;width:min(100%,760px)}
.kb .r{display:flex;gap:6px;justify-content:center}
.key{flex:1;max-width:58px;height:clamp(36px,6.2vh,52px);border-radius:10px;border:none;background:#fff;font-family:var(--kid);font-weight:700;font-size:clamp(17px,2.6vh,24px);display:grid;place-items:center;position:relative;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08);padding:0;border-bottom:6px solid var(--fc,#ccc)}
.key.wide{max-width:none;flex:none;width:clamp(240px,42%,330px)}
.key.bump::after{content:"";position:absolute;bottom:7px;width:14px;height:3px;border-radius:3px;background:#8794B8}
.key.next{background:var(--sun);transform:translateY(-3px);box-shadow:0 0 0 4px #fff,0 0 0 8px var(--fc,var(--sun));animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px #fff,0 0 0 12px var(--fc,var(--sun))}}
.key.hit{background:#C8F7D7} .key.miss{background:#FFD0DE}
.key.dim{opacity:.35}
.hands{display:flex;gap:40px;justify-content:center}
.hands svg{width:150px;height:auto}
.hands .f{stroke:var(--line);stroke-width:3}
.hands .f.on{animation:fing .8s infinite}
@keyframes fing{50%{transform:translateY(-6px)}}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(34,48,90,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{max-width:560px;width:100%;padding:22px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;max-height:100%;overflow:auto}
.modal h2{font-size:40px;font-weight:800}
.modal p{margin:0;font-size:19px}
.modal .acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.bigstars{display:flex;gap:6px}
.bigstars svg{width:72px;height:72px;transform:scale(0);animation:starin .45s forwards}
@keyframes starin{70%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1)}}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stat{background:var(--paper2);border:3px solid var(--line);border-radius:16px;padding:8px 14px;min-width:110px}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--ink2)}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:60;background:var(--paper);border:3px solid var(--line);border-radius:18px;box-shadow:0 6px 0 var(--shadow);padding:10px 18px;font-family:var(--display);font-weight:800;font-size:22px;display:flex;align-items:center;gap:10px;animation:toastin .3s}
@keyframes toastin{from{transform:translate(-50%,-30px);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* games */
.game-area{flex:1;min-height:160px;position:relative;overflow:hidden;border-radius:var(--r)}
.bubbles-bg{background:linear-gradient(#7FD0FF,#2F8FE8);}
.bub{position:absolute;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-family:var(--kid);font-weight:700;font-size:44px;color:var(--ink);background:radial-gradient(circle at 32% 30%,#fff 0 12%,rgba(255,255,255,.55) 13% 40%,rgba(255,255,255,.25) 70%);border:4px solid var(--bc,#fff);box-shadow:inset 0 0 18px rgba(255,255,255,.7)}
.bub.popped{animation:popb .28s forwards}
@keyframes popb{to{transform:scale(1.7);opacity:0}}
.bub.gone{transition:opacity .6s;opacity:0}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.combo{font-family:var(--display);font-weight:800;font-size:26px;color:#fff;text-shadow:0 3px 0 var(--ink)}
.track-wrap{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.track{position:relative;height:128px;flex:none;border:3px solid var(--line);border-radius:var(--r);overflow:hidden;background:linear-gradient(#BDEBFF 0 45%,#7DD38F 45% 100%)}
.lane{position:absolute;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg,#fff 0 18px,transparent 18px 34px)}
.runner{position:absolute;width:86px;transition:left .5s cubic-bezier(.3,1.6,.6,1);transform:translateX(-50%)}
.runner.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateX(-50%) translateY(-26px)}}
.flag{position:absolute;right:20px;top:20px;width:40px}
.wordbox .line{font-size:clamp(32px,4.4vw,52px)}
.wordbox .lbl{font-size:16px;font-weight:600;color:var(--ink2)}
.wordbox{padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.dig-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex:1;min-height:0}
.tilesand{border:3px solid var(--line);border-radius:18px;background:repeating-linear-gradient(45deg,#F3C98B 0 14px,#EDBB75 14px 28px);display:grid;place-items:center;font-size:52px;position:relative;min-height:70px;box-shadow:0 5px 0 #B98840;overflow:hidden}
.tilesand.open{background:#FFF4DE;animation:pop .4s}
.tilesand.next{outline:5px dashed var(--berry);outline-offset:-10px}
.tilesand .nw{position:absolute;top:6px;right:6px;background:var(--berry);color:#fff;font-family:var(--display);font-weight:800;font-size:14px;border-radius:10px;padding:1px 8px;border:2px solid var(--line)}
@keyframes pop{50%{transform:scale(1.08)}}

/* studio / shop */
.studio{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:16px;height:100%;min-height:0}
.preview{display:flex;flex-direction:column;overflow:hidden;min-height:0}
.preview .stage{min-height:240px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:10px}
.tab{border:3px solid var(--line);border-radius:14px;background:var(--paper);padding:6px 12px;font-family:var(--display);font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--line)}
.tab.on{background:var(--ink);color:#fff}
.panel{display:flex;flex-direction:column;min-height:0;padding:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px;overflow:auto;padding:4px 4px 10px;min-height:0;align-content:start}
.opt{border:3px solid var(--line);border-radius:18px;background:var(--paper2);padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;box-shadow:0 4px 0 var(--line);min-height:120px}
.opt .th{width:84px;height:84px;display:grid;place-items:center;overflow:hidden;border-radius:14px}
.opt .th svg{width:100%;height:100%}
.opt .nm{font-size:13px;font-weight:600;text-align:center;line-height:1.1}
.opt.on{background:#D6F8E1;outline:4px solid var(--grass);outline-offset:2px}
.opt .price{position:absolute;top:-10px;right:-8px;background:var(--sun);border:3px solid var(--line);border-radius:999px;font-family:var(--display);font-weight:800;font-size:15px;padding:0 8px 0 4px;display:flex;align-items:center;gap:2px}
.opt .price svg{width:18px;height:18px}
.opt.locked .th{filter:saturate(.5) brightness(.95)}
.sw{width:64px;height:64px;border-radius:50%;border:3px solid var(--line)}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.badge{padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.badge .medal{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-size:42px;border:3px solid var(--line);background:var(--sun);box-shadow:0 4px 0 var(--sun-d)}
.badge.off .medal{background:#E3E9F5;box-shadow:0 4px 0 #A8B3CF;filter:grayscale(1);opacity:.6}
.badge b{font-family:var(--display);font-size:19px}
.badge span{font-size:13px;color:var(--ink2)}
.stick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.stk{padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:50px;text-align:center}
.stk span{font-size:13px;font-weight:600}
.stk.off{background:#E3E9F5}
.stk.off .e{filter:brightness(0) opacity(.18)}

.form{max-width:760px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.form h2{font-size:36px}
.name-in{font-family:var(--kid);font-weight:700;font-size:40px;border:3px solid var(--line);border-radius:18px;padding:8px 16px;width:100%;box-sizing:border-box;color:var(--ink);background:var(--paper2)}
.pick-row{display:flex;flex-wrap:wrap;gap:12px}
.pick{border:3px solid var(--line);border-radius:18px;background:var(--paper2);padding:8px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;min-width:90px}
.pick.on{background:#D6F8E1;outline:4px solid var(--grass);outline-offset:2px}
.pick svg{width:96px;height:96px}
.pick b{font-family:var(--display);font-size:18px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:10px;border-radius:9px;background:#C4D0EA}
.steps i.on{background:var(--grass)}

.grown{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grown table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.grown th,.grown td{padding:8px 10px;border-bottom:2px solid #DCE4F5;text-align:left}
.grown th{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}

function shade(hex, amt){
  if(!hex || hex[0] !== '#') return hex;
  let n = parseInt(hex.slice(1),16), r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function handsSVG(active, opts={}){
  // simple two-hand diagram; fingers keyed lp..rp, thumbs th
  // opts.color: fill every finger with its colour; opts.pick: fingers are buttons (data-act="qpick")
  const f = (id, x, y, h, rot=0) => {
    const fid = id.startsWith('th')?'th':id;
    const on = active===id || (active==='th' && id.startsWith('th'));
    const col = FINGER_COL[fid];
    const fill = on||opts.color ? col : '#fff';
    const pick = opts.pick ? ` data-act="qpick" data-f="${fid}" class="pickf" role="button" aria-label="${FINGER_NAME[fid]}"` : '';
    return `<g transform="rotate(${rot} ${x+9} ${y+h})"${pick}>${opts.pick?`<rect x="${x-5}" y="${y-6}" width="28" height="${h+8}" fill="transparent"/>`:''}<rect class="f${on?' on':''}" x="${x}" y="${y}" width="18" height="${h}" rx="9" fill="${fill}"/></g>`;
  };
  const left = `<svg viewBox="0 0 150 120" aria-hidden="true">${f('thL',99,58,38,55)}<path d="M20,70 Q22,112 70,114 Q110,112 112,80 L112,64 L20,64 Z" fill="#FFE3CC" stroke="#22305A" stroke-width="3"/>${f('lp',18,26,44,-8)}${f('lr',42,10,58,-3)}${f('lm',66,4,64)}${f('li',90,14,54,4)}<text x="64" y="104" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="16" fill="#22305A">LEFT</text></svg>`;
  const right = `<svg viewBox="0 0 150 120" aria-hidden="true">${f('thR',33,58,38,-55)}<path d="M130,70 Q128,112 80,114 Q40,112 38,80 L38,64 L130,64 Z" fill="#FFE3CC" stroke="#22305A" stroke-width="3"/>${f('ri',42,14,54,-4)}${f('rm',66,4,64)}${f('rr',90,10,58,3)}${f('rp',114,26,44,8)}<text x="86" y="104" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="16" fill="#22305A">RIGHT</text></svg>`;
  return left + right;
}

function fixPlayer(p){
  if(!p.v){ // v1 saves: lessons were numbered before Hands Home was added at the start
    const old = p.lessons || {}, moved = {};
    for(const k of Object.keys(old)) moved[(+k)+1] = old[k];
    if(Object.values(old).some(l=>l && l.stars)) moved[0] = {stars:1,bestWpm:0,bestAcc:1,plays:0};
    p.lessons = moved; p.v = 2;
  }
  const d = blankPlayer(p.name||'Player');
  for(const k of Object.keys(d)){
    if(p[k]===undefined) p[k]=d[k];
    else if(d[k] && typeof d[k]==='object' && !Array.isArray(d[k])) for(const kk of Object.keys(d[k])) if(p[k][kk]===undefined) p[k][kk]=d[k][kk];
  }
  if(!p.pets.length) { const pet={uid:uid(),kind:'kitten',name:'Kitty',color:'natural',acc:'none'}; p.pets.push(pet); p.activePet=pet.uid; }
  if(!p.pets.find(x=>x.uid===p.activePet)) p.activePet = p.pets[0].uid;
  return p;
}

let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(AC.state==='suspended') AC.resume(); return AC; }
function tone(f, d, type='sine', vol=.07, when=0, to=null){
  const a = ac(); if(!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if(to) o.frequency.exponentialRampToValueAtTime(to, t+d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.02);
}
const SFX = {
  key:()=>tone(820,.05,'sine',.035),
  miss:()=>tone(210,.14,'triangle',.06,0,150),
  pop:()=>{tone(420,.09,'sine',.08,0,900);},
  coin:()=>{tone(988,.07,'square',.025);tone(1319,.16,'square',.025,.07);},
  line:()=>{tone(660,.08,'triangle',.06);tone(880,.12,'triangle',.06,.08);},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.08,i*.12)),
  badge:()=>[784,988,1175,1568].forEach((f,i)=>tone(f,.14,'sine',.07,i*.09)),
  hop:()=>tone(300,.15,'sine',.06,0,700),
  dig:()=>tone(160,.12,'sawtooth',.03,0,90),
  pet:()=>{tone(700,.1,'sine',.05,0,1000);tone(900,.12,'sine',.04,.1,1200);}
};
function sfx(n){ if(P && !P.settings.sound) return; try{ SFX[n] && SFX[n](); }catch(e){} }
let VOICES = [], VOICE = null;
function voiceScore(v){
  const n = v.name; let s = 0;
  if(/natural|neural|enhanced|premium/i.test(n)) s += 100;
  if(/^Google US English/i.test(n)) s += 80;
  else if(/^Google UK English Female/i.test(n)) s += 75;
  else if(/^Google/i.test(n)) s += 60;
  if(/Samantha|Aria|Jenny|Ava|Allison|Susan|Karen|Moira|Tessa/i.test(n)) s += 50;
  if(/espeak|compact|Fred|Albert|Zarvox|Trinoids|Whisper|Bad News|Bells|Boing|Bubbles|Cellos|Wobble|Jester|Organ|Superstar|Ralph|Junior/i.test(n)) s -= 80;
  if(/^en[-_]US/i.test(v.lang)) s += 6; else if(/^en[-_]GB/i.test(v.lang)) s += 4;
  return s;
}
function loadVoices(){
  try{
    const s = window.speechSynthesis; if(!s) return;
    VOICES = s.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));
    VOICE = (DB.voiceName && VOICES.find(v=>v.name===DB.voiceName)) || VOICES[0] || null;
    if(currentScreen==='grown' && typeof fillVoices==='function') fillVoices();
  }catch(e){}
}
try{ if(window.speechSynthesis){ speechSynthesis.addEventListener ? speechSynthesis.addEventListener('voiceschanged', loadVoices) : (speechSynthesis.onvoiceschanged = loadVoices); } }catch(e){}
function speak(t){
  try{
    const s = window.speechSynthesis; if(!s) return;
    if(!VOICES.length) loadVoices();
    const go = () => {
      const u = new SpeechSynthesisUtterance(t);
      if(VOICE){ u.voice = VOICE; u.lang = VOICE.lang; }
      const nice = VOICE && /natural|neural|enhanced|premium|^Google/i.test(VOICE.name);
      u.rate = (DB.voiceRate || 1) * (nice ? 1 : .95);
      u.pitch = nice ? 1 : 1.05;
      s.speak(u);
    };
    if(s.speaking || s.pending){ s.cancel(); setTimeout(go, 60); } else go();
  }catch(e){}
}

/* ---------- learning path: lesson, then practice games until mastered, then the next lesson ---------- */
const GAME_NAME = {bubble:'Bubble Pop', dash:'Pet Dash', dig:'Treasure Dig'};

function practicing(){ const p = P.path; if(!p || p.lesson<0 || p.m>=100) return false; const L = LESSONS[p.lesson]; return !!(L && L.keys && L.kind!=='hands' && nextLesson()===p.lesson+1 && !lessonDone(p.lesson+1)); }
function focusKeys(){ return practicing() ? [...LESSONS[P.path.lesson].keys.replace(/[^a-z]/g,'')] : []; }

  if(practicing()) return {kind:'game', game:GAME_ORDER[P.path.plays % GAME_ORDER.length]};

const goStep = s => s.kind==='lesson' ? go('lesson', s.idx) : s.kind==='game' ? go(s.game) : go('home');
function stepLabel(s){ return s.kind==='lesson' ? 'Next lesson: '+LESSONS[s.idx].title : s.kind==='game' ? 'Practice: '+GAME_NAME[s.game] : 'Home'; }

// call when a game ends; acc is 0..1
function practiceResult(acc){
  const was = practicing();
  if(!was) return {note:'', after:nextStep(), was};
  const keys = focusKeys();
  const pts = acc>=.9 ? 50 : acc>=.8 ? 35 : acc>=.65 ? 20 : 10;
  P.path.plays++; P.path.m = Math.min(100, P.path.m + pts); save();
  const done = P.path.m >= 100;
  if(done) setTimeout(()=>say('You mastered your new keys! Time for the next lesson.'), 1200);
  const note = `<div class="pathnote"><p>${done ? `You mastered ${keyChipsHTML(keys)}!` : `Practicing ${keyChipsHTML(keys)}`}</p>${meterHTML(P.path.m)}${done ? '' : `<p class="note">${acc>=.8 ? 'Great typing! One more round to master them.' : 'Slow and steady wins. Go for right on the first try!'}</p>`}</div>`;

}

  const s = P.stats, got = [];
  const stageDone = st => LESSONS.every((l,i)=>l.stage!==st || lessonDone(i));
  const conds = {
    first: s.lessonsDone>=1, perfect: Object.values(P.lessons).some(l=>l.stars>=3),
    home: stageDone(0), top: stageDone(1), bottom: stageDone(2), champ: LESSONS.every((l,i)=>lessonDone(i)),

    sharp: !!extra.sharp, streak3: P.streak.count>=3, streak7: P.streak.count>=7,
    bubble: !!extra.bubble, racer: P.games.dash.wins>=1, digger: Object.keys(P.stickers).length>=10,
    shopper: P.owned.length>=1 || P.pets.length>=2, petpal: P.pets.length>=2, goal: !!P.badges.goal,

// Finger rings: each finger has a coloured ring that rests on its home key, slides to the key it needs, then goes back home.
function layoutDots(){
  $$('.kb').forEach(kb=>{
    const box = kb.getBoundingClientRect(); if(!box.width) return;
    const any = kb.querySelector('.key:not(.wide)');
    if(any){ const r = any.getBoundingClientRect(); kb.style.setProperty('--ks', Math.round(Math.min(r.height, r.width)*.86)+'px'); }
    kb.querySelectorAll('.fdot').forEach(d=>{
      const f = d.dataset.f, at = d.dataset.at || HOME_KEY[f];
      const k = kb.querySelector(`.key[data-key="${CSS.escape(at)}"]`); if(!k) return;
      const r = k.getBoundingClientRect();
      const x = r.left-box.left+r.width/2, y = r.top-box.top+r.height/2;
      d.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%)`;
    });
    if(!kb.classList.contains('dr')) requestAnimationFrame(()=>kb.classList.add('dr'));
  });

function kbHighlight(ch){

  if(ch==null){ if(h) h.innerHTML=''; if(hands) hands.innerHTML=handsSVG(null); moveFinger(null); return; }

  if(hands) hands.innerHTML = handsSVG(f);

}

/* ---------- typing engine ---------- */
function recFinger(ch, ok){
  if(!P) return; const f = FINGER[ch]; if(!f) return;
  const x = P.fingers[f] || (P.fingers[f] = {ok:0,miss:0}); ok ? x.ok++ : x.miss++;
  if(!ok && ch!==' ') P.keyMiss[ch] = (P.keyMiss[ch]||0)+1;
}
const fingerAcc = f => { const x = P.fingers[f]; return x && x.ok+x.miss>=15 ? x.ok/(x.ok+x.miss) : null; };
function trickyFinger(){ let best=null, low=1; for(const f of FINGER_ORDER){ const a=fingerAcc(f); if(a!=null && a<low && a<.95){ low=a; best=f; } } return best; }
function trickyKeys(n=3){ return Object.entries(P.keyMiss).sort((a,b)=>b[1]-a[1]).filter(e=>e[1]>=2).slice(0,n).map(e=>e[0]); }
const eyesUpUnlocked = () => LESSONS.every((l,i)=>l.stage!==0 || lessonDone(i));
function sleeper(){ let alive = true; cleanups.push(()=>{ alive=false; }); return { alive:()=>alive, wait: ms => new Promise((res,rej)=>setTimeout(()=>alive?res():rej('stop'), ms)) }; }
function waitKey(want, onWrong){
  return new Promise(res=>{ keyHandler = ch => { if(ch===want){ keyHandler=null; kbFlash(ch,true); sfx('key'); res(); } else { kbFlash(ch,false); sfx('miss'); onWrong && onWrong(ch); } }; });
}
function makeTyper(el, text, cb){
  const T = {text, pos:0, errAt:new Set(), keys:0, firstOK:0, activeMs:0, last:0};
  el.innerHTML = [...text].map((ch,i)=>`<span class="c${ch===' '?' sp':''}">${ch===' '?' ':esc(ch)}</span>`).join('');
  const sp = el.children;
  const setCur = () => { if(sp[T.pos]) sp[T.pos].classList.add('cur'); kbHighlight(text[T.pos]); };
  setCur();
  T.key = ch => {
    const now = performance.now();
    if(T.last) T.activeMs += Math.min(now - T.last, 3000);
    T.last = now; T.keys++;
    const exp = text[T.pos];
    if(ch === exp){
      if(!T.errAt.has(T.pos)){ T.firstOK++; recFinger(exp, true); }
      sp[T.pos].classList.remove('cur','err'); sp[T.pos].classList.add('done');
      kbFlash(ch, true); sfx('key');
      T.pos++;
      cb.onCorrect && cb.onCorrect(T);
      if(T.pos >= text.length){ kbHighlight(null); cb.onDone && cb.onDone(T); } else setCur();
    } else {
      if(!T.errAt.has(T.pos)) recFinger(exp, false);
      T.errAt.add(T.pos); sp[T.pos].classList.add('err');
      el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
      kbFlash(ch, false); sfx('miss');
      cb.onWrong && cb.onWrong(T, exp, ch);
    }
  };
  return T;
}

/* ---------- lesson content ---------- */
function fillTo(len, gen){ let s=''; let guard=0; while(s.length < len && guard++<50){ const w=gen(); if(s.length + w.length + 1 > len+4 && s) break; s += (s?' ':'') + w; } return s; }
function lessonLines(idx){
  const L = LESSONS[idx], size = P.settings.size;
  const n = size==='short' ? 3 : 5, len = size==='short' ? 14 : 22;
  const known = knownKeysFor(Math.max(idx, L.keys?idx:idx-1));
  const letters = [...new Set(known.replace(/[^a-z]/g,''))];
  const punct = [...known].filter(c=>c===','||c==='.');
  const words = WORDS.filter(w=>[...w].every(c=>letters.includes(c)));
  const lines = [];
  if(L.set){
    const pool = shuffle(SETS[L.set]);
    if(L.set==='animals'){ let i=0; for(let k=0;k<n;k++) lines.push(fillTo(len, ()=>pool[(i++)%pool.length])); }
    else for(let k=0;k<n;k++) lines.push(pool[k % pool.length]);
    return lines;
  }
  if(L.words){
    for(let k=0;k<n;k++){
      let line = fillTo(len, ()=>rnd(words));
      if(punct.includes(',') && Math.random()<.6){ const parts=line.split(' '); if(parts.length>2){ const p=1+Math.floor(Math.random()*(parts.length-2)); parts[p]+=','; line=parts.join(' ');} }
      if(punct.includes('.')) line += '.';
      lines.push(line);
    }
    return lines;
  }
  const nk = [...L.keys];
  const group = (pool, w) => { let s=''; const m = 2+Math.floor(Math.random()*2); for(let i=0;i<m;i++) s += Math.random()<w ? rnd(nk) : rnd(pool); return s; };
  lines.push(fillTo(len, (()=>{ let i=0; return ()=>nk[(i++)%nk.length].repeat(3); })()));
  const reach = nk.filter(k=>HOME_KEY[FINGER[k]]!==k);
  if(reach.length) lines.push(fillTo(len, ()=>{ const k=rnd(reach), h=HOME_KEY[FINGER[k]]; return h+k+h; }));
  else lines.push(fillTo(len, ()=>group(nk, 1)));
  const pool = [...new Set([...known])].filter(c=>c!==' ');
  const newWords = words.filter(w=>nk.some(c=>w.includes(c)));
  for(let k=2;k<n;k++){
    if(newWords.length>=4 && k===n-1) lines.push(fillTo(len, ()=>rnd(newWords)));
    else lines.push(fillTo(len, ()=>group(pool, .5)));
  }
  return lines;
}

        run=0; S.miss[exp] = (S.miss[exp]||0)+1; kb.classList.add('peek');
        const fe = FINGER[exp], fc = FINGER[ch];
        const m = exp===' ' ? 'Thumb on the space bar!' : (fc && fe && fc!==fe) ? `${sayKey(exp)} uses your ${FINGER_NAME[fe].toLowerCase()}!` : `Find the ${sayKey(exp)} key!`;
        talk.textContent = m; if(T.errAt.size<=3) say(m);
      },
      onDone: T => {
        S.keys+=T.keys; S.firstOK+=T.firstOK; S.chars+=T.text.length; S.ms+=T.activeMs;
        li++; sfx('line'); $$('#ldots i').forEach((d,i)=>d.classList.toggle('on', i<li));
        if(li < lines.length){ cheer(rnd(CHEERS)); keyHandler=null; setTimeout(()=>{ if(currentScreen==='lesson'){ startLine(); keyHandler = k=>typer.key(k); } }, 350); }
        else finish();
      }
    });
  };
  const begin = () => {
    keyHandler = null; intro.hidden = true; lineEl.hidden = false; $('#ldots').hidden = false;
    kb.classList.toggle('eyesup', eyes);
    if(eyes) say('Eyes up! Keep your eyes on the screen.');
    startLine(); keyHandler = k=>typer.key(k);
  };
  const finish = () => {
    keyHandler = null;
    const acc = S.chars ? S.firstOK/S.chars : 1;
    const mins = Math.max(S.ms, 1500)/60000, wpm = Math.round((S.chars/5)/mins);
    const stars = acc>=.97 ? 3 : acc>=.9 ? 2 : 1;
    const prev = P.lessons[idx] || {stars:0,bestWpm:0,bestAcc:0,plays:0};
    const firstTime = !prev.stars;
    const bonus = Math.max(0, stars - prev.stars)*10;
    const eyesBonus = eyes ? 10 : 0;
    const coins = 10 + stars*5 + bonus + eyesBonus;
    if(L.keys && (firstTime || (P.path && P.path.lesson===idx))) { if(firstTime || !P.path) P.path = {lesson:idx, m:0, plays:0}; }
    P.lessons[idx] = {stars:Math.max(stars,prev.stars), bestWpm:Math.max(wpm,prev.bestWpm||0), bestAcc:Math.max(acc,prev.bestAcc||0), plays:(prev.plays||0)+1};
    P.stats.keys += S.keys; P.stats.correct += S.firstOK; if(firstTime) P.stats.lessonsDone++;
    P.stats.bestWpm = Math.max(P.stats.bestWpm, wpm); P.stats.recentWpm = [...P.stats.recentWpm, wpm].slice(-10);
    if(eyes) P.tech.eyesUpLessons++;
    addCoins(coins);
    const goalMsg = recordActivity(Date.now()-S.start);
    const badges = checkBadges({sharp: S.firstOK===S.chars});
    sfx('win'); if(stars===3) confetti();
    const hasNext = idx < LESSONS.length-1;
    const tricky = Object.entries(S.miss).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]).filter(k=>k!==' ');
    say(stars===3 ? 'Perfect! Three stars!' : stars===2 ? 'Great job! Two stars!' : 'You did it! Keep practicing for more stars.');
    openModal(`<h2>${stars===3?'Perfect!':stars===2?'Great job!':'You did it!'}</h2>
      <div class="bigstars">${[1,2,3].map(n=>(n<=stars?ICON.star:ICON.starOff).replace('<svg',`<svg style="animation-delay:${n*.25}s"`)).join('')}</div>
      <div class="stats"><div class="stat"><b>${Math.round(acc*100)}%</b><span>right on first try</span></div><div class="stat"><b>${wpm}</b><span>words a minute</span></div><div class="stat"><b>+${coins}</b><span>coins</span></div></div>
      ${eyes?'<p><b>🙈 Eyes Up bonus: +10 coins</b></p>':''}
      ${tricky.length && stars<3 ? `<p>Tricky keys: ${tricky.map(k=>`<span class="kchip" style="--fc:${FINGER_COL[FINGER[k]]}">${esc(k)}</span>`).join(' ')}</p><p class="note">Practice them in the Finger Gym.</p>`:''}
      ${firstTime && hasNext ? `<p>New lesson unlocked: <b>${esc(LESSONS[idx+1].title)}</b></p>`:''}
      ${goalMsg?`<p><b>${goalMsg}</b></p>`:''}
      ${stars<3?'<p class="note">Get 97% right for 3 stars.</p>':''}
      ${practicing() && P.path.lesson===idx ? `<div class="pathnote"><p>Now practice ${keyChipsHTML(focusKeys())} in a game until you master them!</p>${meterHTML(P.path.m)}</div>` : ''}
      ${savedNote()}<div class="acts">${practicing() && P.path.lesson===idx
        ? `<button class="btn" data-m="again">Try again</button><button class="btn" data-m="next">Skip to next lesson</button><button class="btn big grass" data-m="step" data-default>${esc(stepLabel(nextStep()))}</button>`
        : `<button class="btn" data-m="map">Map</button><button class="btn" data-m="again">Try again</button>${hasNext?'<button class="btn big grass" data-m="next" data-default>Next lesson</button>':'<button class="btn big grass" data-m="home" data-default>Home</button>'}`}</div>`, {
      map:()=>go('map'), again:()=>go('lesson', idx), next:()=>go('lesson', idx+1), home:()=>go('home'), step:()=>goStep(nextStep())
    });
    setTimeout(()=>badgeToasts(badges), 900);
  };

  // intro: show each new key, watch the finger reach for it and come home, then try it once
  const nk = [...L.keys];
  const eyesBtn = () => eyesUpUnlocked() ? `<button class="btn small ${eyes?'grape':''}" data-act="eyes">🙈 Eyes Up mode: ${eyes?'On':'Off'}</button>` : '';
  SCR.eyes = b => { eyes = !eyes; b.outerHTML = eyesBtn(); sfx('key'); if(eyes) say('Eyes Up mode hides the letters. Try not to peek at your hands. Bonus coins!'); };
  SCR.lstart = () => begin();
  const keyChips = nk.map(k=>`<span class="kchip big" style="--fc:${FINGER_COL[FINGER[k]]}" data-k="${esc(k)}">${esc(k)}</span>`).join('');
  const setIntro = (msg, extra='') => { intro.innerHTML = `${nk.length?`<div class="chips">${keyChips}</div>`:''}<p class="istep">${msg}</p>${extra}`; };
  if(!nk.length){
    setIntro(esc(L.tip), `<div class="acts">${eyesBtn()}<button class="btn big grass" data-act="lstart">Start</button></div><p class="note">or press the space bar</p>`);
    say(L.tip + ' Press the space bar to start.');
    waitKey(' ').then(()=>{ if(T0.alive()) begin(); });
    return;
  }
  (async () => {
    try{
      for(const k of nk){
        const f = FINGER[k], home = HOME_KEY[f], fname = FINGER_NAME[f].toLowerCase();
        $$('.kchip').forEach(c=>c.classList.toggle('on', c.dataset.k===k));
        const hands = $('#hands'); if(hands) hands.innerHTML = handsSVG(f);
        if(home===k){
          setIntro(`<b>${esc(k.toUpperCase())}</b> is home for your <b>${esc(fname)}</b>. It rests there.`);
          say(sayKey(k)+' is home for your '+fname+'.');
          moveFinger(f, null, true); await T0.wait(1600);
        } else {
          setIntro(`Watch your <b>${esc(fname)}</b> reach from <b>${esc(home.toUpperCase())}</b> to <b>${esc(k.toUpperCase())}</b>, then come back home.`);
          say('Watch your '+fname+' reach to '+sayKey(k)+', then come back home.');
          await T0.wait(700);
          for(let n=0;n<2;n++){ moveFinger(f, k, true); await T0.wait(800); moveFinger(f, null, true); await T0.wait(700); }
        }
        kbHighlight(k);
        setIntro(`Your turn! Press <b>${esc(k.toUpperCase())}</b> with your <b>${esc(fname)}</b>.`);
        say('Your turn! Press '+sayKey(k)+'.');
        await waitKey(k, ch => { cheer(FINGER[ch]===f ? `Find ${sayKey(k)}!` : `Use your ${fname}!`); });
        cheer(rnd(CHEERS)); kbHighlight(null); await T0.wait(350);
      }
      $$('.kchip').forEach(c=>c.classList.remove('on'));
      setIntro(home_back_msg(), `<div class="acts">${eyesBtn()}<button class="btn big grass" data-act="lstart">Start</button></div><p class="note">or press the space bar</p>`);
      say('Now type the lines. Fingers back home after every reach. Press the space bar to start.');
      await waitKey(' ');
      if(T0.alive()) begin();
    }catch(e){ /* left the screen */ }
  })();
  function home_back_msg(){ return 'Great! Now type the lines. Fingers go <b>back home</b> after every reach.'; }
};

function fingerKeys(f, known){ return Object.keys(FINGER).filter(k=>FINGER[k]===f && known.includes(k)); }

SCREENS.drill = f => {
  currentScreen='drill';
  const known = knownNow(), keys = fingerKeys(f, known), home = HOME_KEY[f];
  const reach = keys.filter(k=>k!==home);
  const n = P.settings.size==='short' ? 3 : 5, len = P.settings.size==='short' ? 14 : 22;
  const lines = [];
  for(let i=0;i<n;i++){
    if(!reach.length) lines.push(fillTo(len, ()=>home.repeat(2+Math.floor(Math.random()*2))));
    else if(i===0) lines.push(fillTo(len, (()=>{ let j=0; return ()=>{ const k=reach[(j++)%reach.length]; return home+k+home; }; })()));
    else lines.push(fillTo(len, ()=>{ let s=home; const m=1+Math.floor(Math.random()*2); for(let q=0;q<m;q++) s+=rnd(reach)+home; return s; }));
  }
  let li = 0, typer = null;
  const S = {chars:0, ok:0};
  app.innerHTML = topbar() + `<div class="main wrap fit"><div class="typing">
    <div class="prompt-wrap"><div class="card prompt"><div class="lbl">Finger Gym: ${esc(FINGER_NAME[f])}</div><div class="line" id="line"></div><div class="dots">${lines.map((_,i)=>`<i data-d="${i}"></i>`).join('')}</div></div>
      <div class="card buddy" style="background:${find(BG,P.avatar.bg).css}"><div class="bubble-talk" id="talk">Reach, then home!</div>${avatarSVG(P.avatar)}${petSVG(activePet())}</div></div>
    ${keyboardHTML(known+' ')}
  </div></div>`;
  say(`Finger drill for your ${FINGER_NAME[f].toLowerCase()}. Reach, then come back home to ${sayKey(home)}.`);
  const startLine = () => {
    $$('.dots i').forEach((d,i)=>d.classList.toggle('on', i<li));
    typer = makeTyper($('#line'), lines[li], { onDone: T => {
      S.chars += T.text.length; S.ok += T.firstOK; li++; sfx('line');
      if(li < lines.length){ keyHandler=null; setTimeout(()=>{ if(currentScreen==='drill'){ startLine(); keyHandler=k=>typer.key(k); } }, 300); }
      else done();
    }, onWrong:(T,exp)=>{ $('#talk').textContent = `${sayKey(exp)} uses your ${FINGER_NAME[FINGER[exp]].toLowerCase()}!`; } });
  };
  const done = () => {
    keyHandler = null;
    const acc = S.ok/S.chars, stars = acc>=.97?3:acc>=.9?2:1, coins = 8 + stars*4;
    P.tech.gymDone++; addCoins(coins);
    const goalMsg = recordActivity(45000), badges = checkBadges();
    sfx('win'); if(stars===3) confetti();
    say(stars===3 ? 'Strong finger! Three stars!' : 'Good work! Your finger is getting stronger.');
    openModal(`<h2>${stars===3?'Strong finger!':'Good work!'}</h2><div class="bigstars">${[1,2,3].map(n=>(n<=stars?ICON.star:ICON.starOff)).join('')}</div>
      <div class="stats"><div class="stat"><b>${Math.round(acc*100)}%</b><span>right on first try</span></div><div class="stat"><b>+${coins}</b><span>coins</span></div></div>${goalMsg?`<p><b>${goalMsg}</b></p>`:''}
      ${savedNote()}<div class="acts"><button class="btn" data-m="again">Again</button><button class="btn big grass" data-m="gym" data-default>Finger Gym</button></div>`, {again:()=>go('drill', f), gym:()=>go('gym')});
    setTimeout(()=>badgeToasts(badges), 900);
  };
  startLine(); keyHandler = k=>typer.key(k);
};

SCREENS.quiz = () => {
  currentScreen='quiz';

    ${keyboardHTML(null, false, 'hidedots')}
  </div></div>`;
  const ask = () => {

    say(k===' ' ? 'Which finger presses the space bar?' : 'Which finger presses '+sayKey(k)+'?');
  };
  SCR.qpick = async b => {
    if(locked) return; locked = true;
    const k = Q[qi], right = FINGER[k], pick = b.dataset.f;
    const fname = right==='th' ? 'thumb' : FINGER_NAME[right].toLowerCase();
    $('#qhands').innerHTML = handsSVG(right, {});

    const T0 = sleeper();

  };
  const end = () => {
    P.tech.quizPlays++; P.tech.quizBest = Math.max(P.tech.quizBest, score);
    const coins = score*2 + (score===10?10:0); addCoins(coins);

  };
  ask();
};

  app.innerHTML = topbar() + `<div class="main wrap fit"><div class="typing"><div class="card game-area bubbles-bg" id="area"></div>${keyboardHTML(gameLetters().join('')+' ', false)}</div></div>`;

function playBubble(sp){
  const area = $('#area'); const letters = gameLetters();
  const total = P.settings.size==='short' ? 20 : 30;
  let spawned=0, popped=0, missed=0, combo=0, bestCombo=0, bubs=[], raf=0, last=performance.now(), spawnT=0, urgent=null, start=Date.now();
  area.innerHTML = `<div class="hud"><span class="chip">${ICON.star}<span id="bp">0</span> / ${total}</span><span class="combo" id="combo"></span><span class="spacer"></span><button class="btn icon-btn" data-act="bpause" aria-label="Pause">${ICON.pause}</button></div>`;
  let paused = false;
  const spawn = () => {
    const W = area.clientWidth, H = area.clientHeight;
    let ch = rnd(letters); if(bubs.some(b=>b.ch===ch) && letters.length>3) ch = rnd(letters);
    const el = document.createElement('div'); el.className='bub'; el.textContent=ch; el.style.setProperty('--bc', FINGER_COL[FINGER[ch]]);
    const b = {ch, el, x: 20 + Math.random()*Math.max(10, W-130), y: H+10, ph: Math.random()*6, v: sp.v*(.85+Math.random()*.3), dead:false};
    el.style.transform = `translate(${b.x}px,${b.y}px)`; area.appendChild(el); bubs.push(b); spawned++;
  };
  const end = () => {
    cancelAnimationFrame(raf); keyHandler=null; kbHighlight(null);
    const pct = popped/total, stars = pct>=.9?3:pct>=.7?2:1;
    const coins = Math.round(popped*sp.m/2) + stars*2;
    P.games.bubble.plays++; P.games.bubble.best = Math.max(P.games.bubble.best, popped);
    addCoins(coins); const goal = recordActivity(Date.now()-start); const bd = checkBadges({bubble: popped===total});
    sfx('win'); if(stars===3) confetti();
    const pr = practiceResult(total ? popped/total : 1);
    openModal(`<h2>${popped===total?'Every bubble!':'Pop-tastic!'}</h2><div class="bigstars">${[1,2,3].map(n=>(n<=stars?ICON.star:ICON.starOff).replace('<svg',`<svg style="animation-delay:${n*.25}s"`)).join('')}</div>
      <div class="stats"><div class="stat"><b>${popped}/${total}</b><span>popped</span></div><div class="stat"><b>${bestCombo}</b><span>best combo</span></div><div class="stat"><b>+${coins}</b><span>coins</span></div></div>
      ${pr.note}${goal?`<p><b>${goal}</b></p>`:''}${savedNote()}${gameActs(pr, 'bubble', 'Play again', '<button class="btn" data-m="home">Home</button>')}`,
      {home:()=>go('home'), again:()=>go('bubble'), step:()=>goStep(pr.after)});
    say(popped===total?'Wow, every bubble!':'Pop-tastic!');
    setTimeout(()=>badgeToasts(bd), 900);
  };
  const tick = now => {
    const dt = Math.min(50, now-last)/1000; last = now;
    if(!paused && !MODAL){
      spawnT -= dt;
      const live = bubs.filter(b=>!b.dead).length;
      if(spawned<total && spawnT<=0 && live<4){ spawn(); spawnT = (1.7 + Math.random()*.6) * (60/sp.v); }
      for(const b of bubs){ if(b.dead) continue; b.y -= b.v*dt; b.ph += dt*2; const x = b.x + Math.sin(b.ph)*10; b.el.style.transform=`translate(${x}px,${b.y}px)`;
        if(b.y < -90){ b.dead=true; missed++; combo=0; $('#combo').textContent=''; b.el.remove(); } }
      bubs = bubs.filter(b=>!b.dead || b.el.isConnected);
      const u = bubs.filter(b=>!b.dead).sort((a,b)=>a.y-b.y)[0];
      const uch = u ? u.ch : null; if(uch!==urgent){ urgent=uch; kbHighlight(uch); }
      if(spawned>=total && !bubs.some(b=>!b.dead)){ end(); return; }
    }
    raf = requestAnimationFrame(tick);
  };
  keyHandler = ch => {
    if(paused) return;
    const m = bubs.filter(b=>!b.dead && b.ch===ch).sort((a,b)=>a.y-b.y)[0];
    if(m){ m.dead=true; m.el.classList.add('popped'); setTimeout(()=>m.el.remove(),300); popped++; combo++; bestCombo=Math.max(bestCombo,combo);
      sfx('pop'); kbFlash(ch,true); $('#bp').textContent=popped; $('#combo').textContent = combo>=3 ? `Combo x${combo}!` : '';
      if(combo>0 && combo%5===0) addCoins(1);
    } else { sfx('miss'); kbFlash(ch,false); combo=0; $('#combo').textContent=''; }
  };
  SCR.bpause = () => { paused = true; openModal(`<h2>Paused</h2><div class="acts"><button class="btn" data-m="quit">Quit</button><button class="btn big grass" data-m="go" data-default>Keep playing</button></div>`, {quit:()=>go('home'), go:()=>{ closeModal(); paused=false; last=performance.now(); }}); };
  const vis = () => { if(document.hidden && !paused && keyHandler) SCR.bpause(); };
  document.addEventListener('visibilitychange', vis);
  cleanups.push(()=>{ cancelAnimationFrame(raf); document.removeEventListener('visibilitychange', vis); });
  say('Pop the bubbles!');
  raf = requestAnimationFrame(t=>{ last=t; tick(t); });
}

/* ---- pet dash ---- */
SCREENS.dash = () => {
  currentScreen='dash';
  const pet = activePet();
  const N = P.settings.size==='short' ? 8 : 12;
  const words = shuffle(gameWords()).slice(0, N);
  while(words.length < N) words.push(rnd(gameWords()));
  const rec = P.stats.recentWpm.length ? P.stats.recentWpm.reduce((a,b)=>a+b,0)/P.stats.recentWpm.length : 6;
  const cpm = Math.max(18, rec*5*.8);
  const totalChars = words.reduce((s,w)=>s+w.length+1,0);
  const pacerSecs = totalChars/cpm*60 + 2;
  app.innerHTML = topbar() + `<div class="main wrap fit"><div class="track-wrap">
    <div class="track"><div class="lane" style="top:56%"></div><div class="flag">${ICON.flag}</div>
      <div class="runner" id="rPet" style="left:7%;top:2px;width:66px">${petSVG(pet)}</div>
      <div class="runner" id="rSnail" style="left:7%;top:76px;width:58px;transition:none">${snailSVG()}</div></div>
    <div class="card wordbox"><div class="lbl" id="wcount">Word 1 of ${N}</div><div class="line" id="line"></div><div class="note" id="talk">Type the word to help ${esc(pet.name)} run! Shelly the snail wants to race.</div></div>
    ${keyboardHTML(gameLetters().join('')+' ', false)}
  </div></div>`;
  let wi=0, typer=null, started=0, raf=0, snailDone=false, keys=0, firstOK=0, chars=0;
  const rPet=$('#rPet'), rSnail=$('#rSnail'), talk=$('#talk');
  const pos = p => (7 + Math.min(1,p)*80)+'%';
  const loop = () => {
    const p = (Date.now()-started)/1000/pacerSecs;
    rSnail.style.left = pos(p);
    if(p>=1 && !snailDone){ snailDone=true; talk.textContent='Shelly made it! Keep going, you can finish!'; }
    raf = requestAnimationFrame(loop);
  };
  cleanups.push(()=>cancelAnimationFrame(raf));
  const nextWord = () => {
    $('#wcount').textContent = `Word ${wi+1} of ${N}`;
    say(words[wi]);
    typer = makeTyper($('#line'), words[wi], {
      onCorrect: T => { if(!started){ started=Date.now(); loop(); } },
      onDone: T => {
        keys+=T.keys; firstOK+=T.firstOK; chars+=T.text.length;
        wi++; rPet.style.left = pos(wi/N); rPet.classList.remove('hop'); void rPet.offsetWidth; rPet.classList.add('hop'); sfx('hop');
        if(wi>=N) return finish();
        keyHandler=null; setTimeout(()=>{ if(currentScreen==='dash'){ nextWord(); keyHandler=k=>typer.key(k);} }, 300);
      }
    });
  };
  const finish = () => {
    keyHandler=null; cancelAnimationFrame(raf);
    const win = !snailDone; const acc = chars? firstOK/chars : 1; const stars = acc>=.97?3:acc>=.9?2:1;
    const coins = (win?20:10) + stars*3;
    P.games.dash.plays++; if(win) P.games.dash.wins++; P.stats.keys+=keys; P.stats.correct+=firstOK;
    addCoins(coins); const goal = recordActivity(Date.now()-started); const bd = checkBadges();
    sfx('win'); if(win) confetti();
    say(win ? `${pet.name} wins!` : 'Shelly won this time. Try again!');
    const pr = practiceResult(acc);
    openModal(`<h2>${win?`${esc(pet.name)} wins!`:'So close!'}</h2><div style="width:140px">${petSVG(pet)}</div>
      <p>${win?'You beat Shelly the snail!':'Shelly got there first this time. Rematch?'}</p>
      <div class="stats"><div class="stat"><b>${Math.round(acc*100)}%</b><span>right on first try</span></div><div class="stat"><b>+${coins}</b><span>coins</span></div></div>
      ${pr.note}${goal?`<p><b>${goal}</b></p>`:''}${savedNote()}${gameActs(pr, 'dash', 'Race again', '<button class="btn" data-m="home">Home</button>')}`,
      {home:()=>go('home'), again:()=>go('dash'), step:()=>goStep(pr.after)});
    setTimeout(()=>badgeToasts(bd), 900);
  };
  nextWord(); keyHandler = k=>typer.key(k);
};

    const pet = activePet();
    openModal(`<h2>Name your pet</h2><div style="width:120px">${petSVG(pet)}</div><input class="name-in" id="rn" maxlength="12" autocomplete="off" value="${esc(pet.name)}"><div class="acts"><button class="btn big grass" data-m="ok">Save name</button></div>`, {
      ok:()=>{ const v=$('#rn').value.trim(); if(v){ pet.name=v; save(); } closeModal(); render(); }
    });
    $('#rn').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); MODAL.handlers.ok(); } });
  };
  SCR.prename = renamePet;
  render();
};

/* ---- badges + stickers ---- */
SCREENS.badges = () => {
  currentScreen='badges';
  app.innerHTML = topbar() + `<div class="main wrap"><h2 style="font-size:36px;margin-bottom:12px">Badges</h2><div class="badges">${BADGES.map(b=>`<div class="card badge ${P.badges[b.id]?'':'off'}"><div class="medal">${b.e}</div><b>${esc(b.name)}</b><span>${esc(b.hint)}</span></div>`).join('')}</div></div>`;
};
SCREENS.stickers = () => {
  currentScreen='stickers';
  app.innerHTML = topbar() + `<div class="main wrap"><div style="display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap"><h2 style="font-size:36px">Sticker Book</h2><span class="chip">${Object.keys(P.stickers).length} / ${STICKERS.length}</span><span class="spacer"></span><button class="btn sun" data-act="dig">Go dig</button></div>
    <div class="stick-grid">${STICKERS.map((s,i)=>{ const n=P.stickers[i]; return `<div class="card stk ${n?'':'off'}"><span class="e">${s[0]}</span><span>${n?esc(s[1])+(n>1?' x'+n:''):'???'}</span>${s[2]?'<span style="color:var(--grape)">Rare</span>':''}</div>`; }).join('')}</div></div>`;
  SCR.dig = ()=>go('dig');
};

/* ---- grown-ups ---- */
function openGate(){
  const a = 6+Math.floor(Math.random()*4), b = 5+Math.floor(Math.random()*5);
  openModal(`<h2>Grown-ups only</h2><p>What is ${a} + ${b}?</p><input class="name-in" id="gate" inputmode="numeric" autocomplete="off" style="max-width:200px;text-align:center"><div class="acts"><button class="btn" data-m="no">Cancel</button><button class="btn big wave" data-m="ok">Open</button></div>`, {
    no: closeModal, ok: ()=>{ if(+$('#gate').value === a+b){ closeModal(); go('grown'); } else { $('#gate').classList.add('shake'); $('#gate').value=''; } }
  });
  $('#gate').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); MODAL.handlers.ok(); } });
}
function encodeCode(players){ const json = JSON.stringify({v:1, app:'pawsandkeys', players}); return 'PAWS1.' + btoa(unescape(encodeURIComponent(json))); }
function decodeCode(s){ s = s.replace(/\s+/g,''); if(!s.startsWith('PAWS1.')) throw new Error('That does not look like a Paws & Keys backup code.'); const d = JSON.parse(decodeURIComponent(escape(atob(s.slice(6))))); if(!d.players || !Array.isArray(d.players)) throw new Error('The code is missing player data.'); return d.players; }
SCREENS.grown = () => {
  currentScreen='grown';
  const prevP = P;
  const list = DB.order.map(id=>DB.players[id]).filter(Boolean);
  const mins = ms => Math.round(ms/60000);
  const avgAcc = p => p.stats.keys ? Math.round(p.stats.correct/p.stats.keys*100) : 0;
  let persisted = 'unknown';
  app.innerHTML = `<div class="topbar wrap"><button class="btn" data-act="gback">${ICON.back.replace('<svg','<svg width="26" height="26"')} Back</button><h2 style="font-size:30px">Grown-ups</h2></div>
  <div class="main wrap"><div class="grown">
    <div class="card sec"><h2>Progress</h2>${list.length?`<div class="tbl-wrap"><table><thead><tr><th>Player</th><th>Lessons</th><th>Stars</th><th>Best speed</th><th>Accuracy</th><th>Keys typed</th><th>Minutes</th><th>Streak</th><th>Coins</th><th></th></tr></thead><tbody>
      ${list.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${Object.values(p.lessons).filter(l=>l.stars).length} / ${LESSONS.length}</td><td>${Object.values(p.lessons).reduce((s,l)=>s+(l.stars||0),0)}</td><td>${p.stats.bestWpm} wpm</td><td>${avgAcc(p)}%</td><td>${p.stats.keys.toLocaleString()}</td><td>${mins(p.stats.ms)}</td><td>${p.streak.count}</td><td>${p.coins}</td>
        <td style="white-space:nowrap"><button class="btn small" data-act="gcode" data-id="${p.id}">Backup code</button> <button class="btn small" data-act="gcoins" data-id="${p.id}">+50 coins</button> <button class="btn small berry" data-act="gdel" data-id="${p.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<p>No players yet.</p>'}
      <p class="note">Accuracy counts keys pressed right on the first try. Speed is words per minute in lessons (5 letters = 1 word).</p></div>
    <div class="card sec"><h2>Fingers</h2>${list.length?`<div class="tbl-wrap"><table><thead><tr><th>Player</th>${FINGER_ORDER.map(f=>`<th>${esc(FINGER_NAME[f].replace(' finger','').replace('Left','L').replace('Right','R'))}</th>`).join('')}<th>Thumbs</th><th>Tricky keys</th><th>Technique</th></tr></thead><tbody>
      ${list.map(p=>{ const pc = f => { const x=p.fingers&&p.fingers[f]; if(!x||x.ok+x.miss<15) return '<td class="note">-</td>'; const v=Math.round(x.ok/(x.ok+x.miss)*100); return `<td${v<85?' style="color:var(--berry-d);font-weight:700"':''}>${v}%</td>`; };
        const tk = Object.entries(p.keyMiss||{}).sort((a,b)=>b[1]-a[1]).filter(e=>e[1]>=2).slice(0,3).map(e=>esc(e[0])).join(' ') || '-';
        const t = p.tech||{};
        return `<tr><td><b>${esc(p.name)}</b></td>${FINGER_ORDER.map(pc).join('')}${pc('th')}<td>${tk}</td><td style="min-width:220px">Hands Home ${p.lessons&&p.lessons[0]&&p.lessons[0].stars?'done':'not yet'}, quiz best ${t.quizBest||0}/10, ${t.gymDone||0} drills, ${t.eyesUpLessons||0} Eyes Up lessons</td></tr>`; }).join('')}</tbody></table></div>`:''}
      <p class="note">Right on the first try, per finger, across lessons and games. A dash means fewer than 15 keys so far. Red means under 85%. The Finger Gym tile points your child to the weakest finger.</p></div>
    <div class="card sec"><h2>Voice</h2>
      <div class="vrow"><button class="btn" id="gvbtn" data-act="gvoice">Read aloud</button><span class="note">for every player on this Chromebook</span></div>
      <div class="vrow"><label for="gvsel"><b>Voice</b></label><select id="gvsel"></select><button class="btn wave" data-act="gvtest">Test</button></div>
      <div class="vrow"><b>Speed</b>${[[.85,'Slower'],[1,'Normal'],[1.12,'Faster']].map(([r,n])=>`<button class="btn small ${(DB.voiceRate||1)===r?'sun':''}" data-act="grate" data-r="${r}">${n}</button>`).join('')}</div>
      <p class="note">Voices come from this Chromebook, not the game. The ones marked Natural or Google sound most like a real person, and Google voices need the internet. "Best available" picks one for you.</p></div>
    <div class="card sec"><h2>Saving</h2>
      <p>Progress saves automatically in this browser, on this device. ${storageOK?'Saving is working.':'<b style="color:var(--berry-d)">This browser is blocking saving right now.</b>'} <span id="persist"></span></p>
      <p class="note">Clearing browsing data, a guest or incognito window, or a different Chromebook will not have this progress. Make a backup code now and then, and paste it below to bring a player back.</p>
      <div class="acts" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn wave" data-act="gall">Backup code for everyone</button></div>
      <textarea id="gin" placeholder="Paste a backup code here"></textarea>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn grass" data-act="grestore">Restore from code</button><span id="gmsg" class="note"></span></div>
    </div>
  </div></div>`;
  try{ navigator.storage && navigator.storage.persisted && navigator.storage.persisted().then(v=>{ const el=$('#persist'); if(el) el.textContent = v ? 'Chrome has marked this storage as protected.' : ''; }); }catch(e){}
  fillVoices();
  const allVoice = list.length ? list.every(p=>p.settings.voice) : true;
  SCR.gvoice = () => { const on = !allVoice; list.forEach(p=>p.settings.voice = on); saveNow(); go('grown'); if(on) speak('Read aloud is on.'); };
  SCR.gvtest = () => speak(rnd(['Great job! Three stars!','Your turn! Press F.','Nice to meet you! Pick a pet friend.','Watch your pointer finger reach, then come back home.']));
  SCR.grate = b => { DB.voiceRate = +b.dataset.r; saveNow(); go('grown'); speak('This is how fast I talk.'); };
  $('#gvsel').addEventListener('change', e=>{ DB.voiceName = e.target.value || null; loadVoices(); saveNow(); speak('Hi! This is my voice.'); });
  $('#gvbtn').textContent = 'Read aloud: ' + (allVoice?'On':'Off'); $('#gvbtn').classList.toggle('grass', allVoice);
  SCR.gback = () => { P = prevP && DB.players[prevP.id] ? DB.players[prevP.id] : null; go(P?'home':'profiles'); };
  SCR.gcode = b => showCode('Backup code for '+DB.players[b.dataset.id].name, [DB.players[b.dataset.id]]);
  SCR.gall = () => showCode('Backup code for everyone', list);
  SCR.gcoins = b => { DB.players[b.dataset.id].coins += 50; saveNow(); go('grown'); };
  SCR.gdel = b => {
    const p = DB.players[b.dataset.id];
    openModal(`<h2>Delete ${esc(p.name)}?</h2><p>This removes all of ${esc(p.name)}'s progress from this browser. Make a backup code first if you might want it back.</p><div class="acts"><button class="btn" data-m="no" data-default>Keep</button><button class="btn berry" data-m="yes">Delete</button></div>`, {
      no: closeModal, yes: ()=>{ delete DB.players[p.id]; DB.order = DB.order.filter(x=>x!==p.id); if(prevP && prevP.id===p.id) { P=null; } saveNow(); go('grown'); }
    });
  };
  SCR.grestore = () => {
    const msg = $('#gmsg');
    try{
      const players = decodeCode($('#gin').value);
      let added=0, replaced=0;
      for(const raw of players){ if(!raw || !raw.id || !raw.name) continue; const p = fixPlayer(raw); if(DB.players[p.id]) replaced++; else { DB.order.push(p.id); added++; } DB.players[p.id]=p; }
      saveNow(); go('grown'); $('#gmsg').textContent = `Restored ${added+replaced} player${added+replaced===1?'':'s'}.`;
    }catch(e){ msg.textContent = e.message && e.message.startsWith('Th') ? e.message : 'That code could not be read. Check that the whole code was copied.'; }
  };
};

function fillVoices(){
  const sel = document.getElementById('gvsel'); if(!sel) return;
  const label = v => v.name.replace(/^Microsoft /,'') + (v.localService ? '' : ' (online)');
  sel.innerHTML = `<option value="">Best available${VOICES[0]?' ('+esc(VOICES[0].name)+')':''}</option>` + VOICES.map(v=>`<option value="${esc(v.name)}"${DB.voiceName===v.name?' selected':''}>${esc(label(v))}</option>`).join('');
  if(!VOICES.length) sel.innerHTML = '<option value="">No voices found on this device</option>';
}

/* ---------- boot ---------- */
loadDB();
loadVoices();
askPersist();
if(DB.last && DB.players[DB.last] && DB.order.length===1){ P = DB.players[DB.last]; go('home'); }
else go('profiles');
</script></body></html>
